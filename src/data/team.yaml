# Team page data. Edit this file to add, update or move people.
#
# Photos: put a square photo in src/assets/team/ and give its file name in `photo`.
#         Without a photo, the card shows the person's initials.
# Links (all optional): email, website, scholar, github, linkedin, researchgate, dblp
# focus: optional one-line research focus shown under the role.
# bio:   optional short paragraph (used on the PI cards).
#
# When someone leaves, move their entry to `alumni` (src/pages/alumni.astro) and add
# `years` (e.g. "2019–2025"), `after` (where they went next) and, optionally, `quote`
# (a short testimonial). The photo and links can stay.

pis:
  - name: E. Paulo Alves
    role: Co-director
    title: Associate Professor, Physics & Astronomy
    bio: >-
      His research combines large-scale kinetic simulations and AI/ML to study plasma astrophysics and intense laser–plasma interactions. He received
      his PhD from Instituto Superior Técnico, Lisbon, and was a researcher at SLAC National Accelerator Laboratory
      before joining UCLA.
    photo: paulo-alves.jpg
    email: epalves@physics.ucla.edu
    scholar: https://scholar.google.com/citations?user=dpMiNBUAAAAJ
  - name: Warren B. Mori
    role: Co-director
    title: Distinguished Professor, Physics & Astronomy and Electrical & Computer Engineering
    bio: >-
      He is a leader in the theory and simulation of plasma-based acceleration and nonlinear laser–plasma
      interactions, and his work has been recognized by numerous awards, including the APS James Clerk Maxwell
      Prize for Plasma Physics.
    photo: warren-mori.jpg
    email: mori@physics.ucla.edu
    scholar: https://scholar.google.com/citations?user=_OsGhQ4AAAAJ

