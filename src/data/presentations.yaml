# Talks and conference proceedings, shown on /presentations.
# `file` is a path under public/ (e.g. presentations/may.pdf); leave it out when there are no slides.

workshops:
  - title: First Annual OSIRIS Users and Developers Workshop
    year: 2017
    agenda: presentations/agenda.pdf
    sessions:
      - title: Introduction to OSIRIS 4.0
        talks:
          - { speaker: Ricardo Fonseca, title: Introduction to OSIRIS 4.0 for developers (and users), file: presentations/introduction.pdf }
          - { speaker: Anton Helm, title: "Implementing a ponderomotive guiding center solver: a case study", file: presentations/helm.pdf }
          - { speaker: Ricardo Fonseca, title: New hardware support in OSIRIS 4.0, file: presentations/fonseca2.pdf }
          - { speaker: Josh May, title: OSIRIS collision package overview, file: presentations/may.pdf }
      - title: Accessing and using OSIRIS through GitHub
        talks:
          - { speaker: Anton Helm, title: Accessing and using OSIRIS through GitHub, file: presentations/helm2.pdf }
      - title: New features in OSIRIS 4.0
        talks:
          - { speaker: Anton Helm, title: Three-dimensional modeling using the ponderomotive guiding center solver, file: presentations/helm3.pdf }
          - { speaker: Asher Davidson and Thamine Dalichaouch, title: The implementation and usage of the quasi-3D algorithm in OSIRIS 4.0, file: presentations/davidson.pdf }
          - { speaker: Thomas Grismayer, title: Numerics for ultra-intense fields, file: presentations/grismayer.pdf }
          - { speaker: Xinlu Xu, title: Customized FD and hybrid FFT/FD algorithms for eliminating the numerical Cherenkov instability (NCI), file: presentations/xu1.key.zip }
          - { speaker: Han Wen, title: "New antennas for modeling the nonlinear optics of plasmas & non-uniform particle weighting", file: presentations/han.pptx }
          - { speaker: Thamine Dalichaouch, title: Azimuthal Fourier mode diagnostic for comparisons of full-3D and quasi-3D simulations, file: presentations/thamine.key }
          - { speaker: Ricardo Fonseca, title: (Beam) field initialization in OSIRIS 4.0, file: presentations/balzarini-fonseca.pdf }
      - title: Short talks on usage of OSIRIS 3.0 and 4.0
        talks:
          - { speaker: Xinlu Xu, title: Modeling laser-driven density downramp injection, file: presentations/xu-modeling.key }
          - { speaker: Asher Davidson, title: Modeling LWFA with the quasi-3D version of OSIRIS, file: presentations/davidson2.pdf }
          - { speaker: Weiming An, title: Modeling plasma wakefield accelerators, file: presentations/weimingan.pdf }
          - { speaker: Jens Osterhoff, title: "OSIRIS usage at DESY: full start-to-end PWFA simulations for FLASHForward", file: presentations/osterhoff.pdf }
          - { speaker: Fabrízio Del Gaudio, title: Particle-in-cell Compton scattering }
          - { speaker: Paulo Alves, title: Coupling of numerical PIC and Monte Carlo }
          - { speaker: Scott Feister, title: Numerical challenges in efficient modeling of colliding flows, file: presentations/feister.pptx }
          - { speaker: Frank Tsung, title: Modeling nonlinear optics of plasmas (relevant to IFE), file: presentations/tsung.pdf }
          - { speaker: Frederico Fiúza, title: Modeling collisionless shocks and overdense laser-plasma interactions }
          - { speaker: Xinlu Xu, title: Modeling ionization injection in OSIRIS, file: presentations/Ionization_Injection_XinluXu.key }
      - title: Documentation for working with and running OSIRIS
        talks:
          - { speaker: Anton Helm, title: Documentation for working with and running OSIRIS, file: presentations/helm4-documentation.pdf }
      - title: Current development and ideas for future plans
        talks:
          - { speaker: Ricardo Fonseca, title: Dynamic load balancing in OSIRIS, file: presentations/fonseca-dynamic.pdf }
          - { speaker: Qiyang Hu and Frank Tsung, title: Overview of the PICKSC Science Gateway, file: presentations/hu-tsung.pdf }
          - { speaker: Michael Touati, title: Integrating UPIC algorithms into OSIRIS, file: presentations/touati.pdf }
          - { speaker: Kyle Miller, title: "Boris correction: exact and approximate", file: presentations/miller.pdf }
          - { speaker: François Courvoisier, title: Research at FEMTO-ST Institute }
          - { speaker: Fábio Cruz, title: Modified spherical coordinate system for PIC simulations of pulsar magnetospheres }
          - { speaker: Giannandrea Inchingolo, title: Multi-dimensional shearing modules in OSIRIS 4.0, file: presentations/inchingolo.pdf }
          - { speaker: Kevin Schoeffler, title: QED energy and relativistic temperature diagnostics }

